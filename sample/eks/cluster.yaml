# Self-managed Fabric 2.5 test destination for re-broadcast.
# Render for your region and address, then create (docs/eks-fabric-runbook.md, step 1):
#   sed -e "s/us-east-1/$AWS_REGION/g" -e "s|<operator-ip>|$(curl -s https://checkip.amazonaws.com)|" cluster.yaml > /tmp/cluster.yaml
#   eksctl create cluster -f /tmp/cluster.yaml   |   teardown.sh
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: fabric-eks
  region: us-east-1
  version: "1.35" # 1.34 leaves standard support on 2026-12-02
  tags: { project: fabric-eks }
vpc:
  cidr: 10.60.0.0/16
  nat: { gateway: Single }
  clusterEndpoints: { publicAccess: true, privateAccess: true }
  # The public API endpoint admits only the operator's address; in-VPC hosts use the private endpoint.
  publicAccessCIDRs: ["<operator-ip>/32"] # your workstation, which runs eksctl and kubectl
availabilityZones: ["us-east-1a", "us-east-1b", "us-east-1c"]
iam:
  withOIDC: true
addons:
  - { name: vpc-cni }
  - { name: coredns }
  - { name: kube-proxy }
  - { name: eks-pod-identity-agent }
  - { name: aws-ebs-csi-driver, useDefaultPodIdentityAssociations: true }
managedNodeGroups:
  - name: ng-fabric
    instanceType: m6i.xlarge
    desiredCapacity: 4
    minSize: 4
    maxSize: 5
    privateNetworking: true
    volumeSize: 100
    volumeType: gp3
    labels: { role: fabric }
    tags: { project: fabric-eks }
    # Project labels make the generated cluster resources easier to identify when
    # inspecting an account. They are not a retention policy.
    propagateASGTags: true
    iam:
      attachPolicyARNs:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
